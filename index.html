        const SERVICE_PERIOD_LABELS = {
          'food': { label: 'Application / Renewal Year', options: ['FY 2026-27', 'FY 2025-26', '1 Year', '2 Years', '5 Years'] },
          'income tax': { label: 'Assessment Year', options: ['AY 2026-27', 'AY 2027-28', 'AY 2025-26'] },

          'tds': { label: 'Quarter / Financial Year', options: ['Q1 FY 2026-27', 'Q2 FY 2026-27', 'Q3 FY 2026-27', 'Q4 FY 2025-26'] },
          'dsc': { label: 'Validity Period', options: ['2 Years', '3 Years', '1 Year'] },
          'msme': { label: 'Registration Year', options: ['FY 2026-27', 'FY 2025-26'] },
          'trademark': { label: 'Application Year', options: ['FY 2026-27', 'FY 2025-26'] },
          'accounting': { label: 'Accounting Period', options: ['August 2026', 'July 2026', 'Q1 FY 2026-27', 'FY 2026-27'] }
        };

        function generateTaskTitle(srvKey, formVal) {
          if (srvKey === 'food') {
            if (formVal.includes('Renewal')) return 'FSSAI Renewal';
            if (formVal.includes('State')) return 'FSSAI State License';
            if (formVal.includes('Central')) return 'FSSAI Central License';
            if (formVal.includes('Basic')) return 'FSSAI Basic Registration';
            return 'FSSAI Registration';
          }
          if (srvKey === 'income tax') {
            if (formVal.includes('ITR-1')) return 'ITR-1 Income Tax Return Filing';
            if (formVal.includes('ITR-2')) return 'ITR-2 Income Tax Return Filing';
            if (formVal.includes('ITR-3')) return 'ITR-3 Income Tax Return Filing';
            if (formVal.includes('ITR-4')) return 'ITR-4 Income Tax Return Filing';
            if (formVal.includes('ITR-5')) return 'ITR-5 Income Tax Return Filing';
            if (formVal.includes('ITR-6')) return 'ITR-6 Income Tax Return Filing';
            if (formVal.includes('ITR-7')) return 'ITR-7 Income Tax Return Filing';
            return 'Income Tax Return Filing';
          }
          if (srvKey === 'gst') {
            if (formVal.includes('3B') && formVal.includes('Payment')) return 'GSTR-3B Tax Payment';
            if (formVal.includes('3B')) return 'GSTR-3B Return Filing';
            if (formVal.includes('1')) return 'GSTR-1 Return Filing';
            if (formVal.includes('CMP')) return 'CMP-08 Return Filing';
            if (formVal.includes('9C')) return 'GSTR-9C Reconciliation & Filing';
            if (formVal.includes('9')) return 'GSTR-9 Annual Return';
            return 'GST Return Filing';
          }
          if (srvKey === 'tds') {
            if (formVal.includes('24Q')) return 'TDS 24Q Return';
            if (formVal.includes('26Q')) return 'TDS 26Q Return';
            if (formVal.includes('27Q')) return 'TDS 27Q Return';
            return 'TDS Return';
          }
          if (srvKey === 'dsc') {
            if (formVal.includes('Class 3')) return 'Class 3 Digital Signature (DSC)';
            if (formVal.includes('Renewal')) return 'Digital Signature Renewal';
            return 'Digital Signature (DSC)';
          }
          if (srvKey === 'msme') return 'MSME / Udyam Registration';
          if (srvKey === 'trademark') return 'Trademark Registration';
          if (srvKey === 'accounting') return 'Monthly Accounting';
          if (srvKey === 'website') return 'Website Maintenance';

          return formVal || 'Filing Work Item';
        }

        function purgeAndPopulateServiceForms(modal) {
          const selects = modal.querySelectorAll('select');
          let srvSelect = null;
          let formSelect = null;
          let periodSelect = null;
          let formLabel = null;
          let periodLabel = null;

          selects.forEach(s => {
            const labelEl = s.previousElementSibling || s.parentElement?.querySelector('label');
            const text = (labelEl ? labelEl.innerText : s.parentElement?.innerText || '').toLowerCase();
            if (text.includes('service category') || text.includes('service')) srvSelect = s;
            if (text.includes('form / work type') || text.includes('form type') || text.includes('return form') || text.includes('form')) {
              formSelect = s;
              formLabel = labelEl;
            }
            if (text.includes('filing period') || text.includes('assessment year') || text.includes('period') || text.includes('year')) {
              periodSelect = s;
              periodLabel = labelEl;
            }
          });

          if (srvSelect && formSelect) {
            // Update Label to "Form / Work Type *"
            if (formLabel && formLabel.innerText !== 'Form / Work Type *') {
              formLabel.innerText = 'Form / Work Type *';
              formLabel.className = 'cwt-field-label-service';
            }

            const srvText = (srvSelect.options[srvSelect.selectedIndex]?.text || srvSelect.value || '').toLowerCase();
            let srvKey = 'income tax';
            if (srvText.includes('food') || srvText.includes('fssai')) srvKey = 'food';
            else if (srvText.includes('gst') && !srvText.includes('accounting')) srvKey = 'gst';
            else if (srvText.includes('tds')) srvKey = 'tds';
            else if (srvText.includes('dsc') || srvText.includes('digital signature')) srvKey = 'dsc';
            else if (srvText.includes('msme') || srvText.includes('udyam')) srvKey = 'msme';
            else if (srvText.includes('trademark')) srvKey = 'trademark';
            else if (srvText.includes('company') || srvText.includes('llp')) srvKey = 'company';
            else if (srvText.includes('accounting') || srvText.includes('bookkeeping')) srvKey = 'accounting';
            else if (srvText.includes('website') || srvText.includes('digital service')) srvKey = 'website';

            // REPOPULATE FORM SELECT IF SERVICE CHANGED OR IF CONTAINS INVALID OPTIONS
            const currentFormOptions = Array.from(formSelect.options).map(o => o.value);
            const validOptions = SERVICE_WORK_OPTIONS[srvKey] || SERVICE_WORK_OPTIONS['income tax'];

            const hasInvalidITR = (srvKey !== 'income tax') && currentFormOptions.some(o => o.includes('ITR-1') || o.includes('ITR-2'));

            if (formSelect.dataset.activeSrvKey !== srvKey || hasInvalidITR) {
              formSelect.dataset.activeSrvKey = srvKey;
              formSelect.innerHTML = '<option value="">-- Select Form / Work Type --</option>';

              validOptions.forEach(optVal => {
                const opt = document.createElement('option');
                opt.value = optVal;
                opt.text = optVal;
                formSelect.appendChild(opt);
              });

              formSelect.selectedIndex = 0;
            }

            // DYNAMIC PERIOD LABEL & OPTIONS
            if (periodSelect && periodLabel) {
              const pInfo = SERVICE_PERIOD_LABELS[srvKey] || SERVICE_PERIOD_LABELS['income tax'];
              if (periodLabel.innerText !== pInfo.label + ' *') {
                periodLabel.innerText = pInfo.label + ' *';
              }
              if (periodSelect.dataset.activePeriodKey !== srvKey) {
                periodSelect.dataset.activePeriodKey = srvKey;
                periodSelect.innerHTML = '';
                pInfo.options.forEach(optVal => {
                  const opt = document.createElement('option');
                  opt.value = optVal;
                  opt.text = optVal;
                  periodSelect.appendChild(opt);
                });
              }
            }

            // AUTO GENERATE TASK TITLE
            const selectedForm = formSelect.options[formSelect.selectedIndex]?.value || '';
            const titleInput = modal.querySelector('input[name="taskTitle"], input[id*="taskTitle"], input[placeholder*="Title"], input[value*="ITR"], input[value*="DSC"], input[value*="GSTR"], input[value*="Sahaj"]');
            if (titleInput && selectedForm) {
              const computedTitle = generateTaskTitle(srvKey, selectedForm);
              if (titleInput.value !== computedTitle) {
                titleInput.value = computedTitle;
                titleInput.dispatchEvent(new Event('input', { bubbles: true }));
                titleInput.dispatchEvent(new Event('change', { bubbles: true }));
              }

              if (!modal.querySelector('.cwt-auto-hint-title')) {
                const hint = document.createElement('div');
                hint.className = 'cwt-auto-hint-title';
                hint.innerHTML = '⚡ <em>Auto-generated from Service & Work Type</em>';
                titleInput.parentNode.appendChild(hint);
              }
            }

            // AUTO FINANCIALS & PAYMENT STATUS
            const feeInput = modal.querySelector('input[name="feeCharged"], input[name="feeAmount"], input[placeholder*="fee"], input[placeholder*="1500"]');
            const advInput = modal.querySelector('input[name="advancePaid"], input[placeholder*="advance"], input[placeholder*="500"]');
            const dueInput = modal.querySelector('input[name="dueAmount"], input[placeholder*="Auto-calculated"], input[value*="Auto"]');
            const pStatusSelect = modal.querySelector('select[name="paymentStatus"], select[id*="paymentStatus"]');

            if (feeInput && advInput) {
              const fee = parseFloat(feeInput.value || 0);
              const adv = parseFloat(advInput.value || 0);
              const due = fee - adv;

              if (dueInput) {
                if (due > 0) dueInput.value = '₹' + due.toLocaleString('en-IN');
                else if (due === 0 && fee > 0) dueInput.value = 'PAID';
                else if (adv > fee) dueInput.value = 'Advance Credit: ₹' + (adv - fee).toLocaleString('en-IN');
              }

              if (pStatusSelect) {
                if (adv === 0) pStatusSelect.value = 'Pending';
                else if (adv > 0 && adv < fee) pStatusSelect.value = 'Partial';
                else if (adv >= fee && fee > 0) pStatusSelect.value = 'Paid';
              }
            }
          }
        }

        // BIND EVENT LISTENERS TO INTERCEPT MODAL OPEN, FOCUS, MOUSEDOWN, AND CHANGE
        document.addEventListener('change', function(e) {
          if (e.target && e.target.tagName === 'SELECT') {
            const modal = e.target.closest('.modal-content, div[role="dialog"], form');
            if (modal) purgeAndPopulateServiceForms(modal);
          }
        });

        document.addEventListener('mousedown', function(e) {
          if (e.target && e.target.tagName === 'SELECT') {
            const modal = e.target.closest('.modal-content, div[role="dialog"], form');
            if (modal) purgeAndPopulateServiceForms(modal);
          }
        });

        document.addEventListener('click', function(e) {
          if (e.target && (e.target.innerText.includes('Add') || e.target.innerText.includes('Edit') || e.target.className.includes('btn'))) {
            setTimeout(function() {
              const modals = document.querySelectorAll('.modal-content, div[role="dialog"], form');
              modals.forEach(m => purgeAndPopulateServiceForms(m));
            }, 100);
          }
        });
      })();
    </script>

          (currentFilter === 'inactive' && c.status === 'Inactive');

        return matchName && matchFilter;

        headers: { 'Content-Type': 'application/json' },

        body: JSON.stringify({ id, status: newStatus })

        .then(data => {

          if (data.success) {

            const client = allClients.find(c => String(c.id) === String(id));

            renderList();

          } else {

            btn.disabled = false;

    // --- Extract Card Data & Trigger WhatsApp Modal ---

    window.cwtShareCardWA = function(cardElem) {

      const textContent = (cardElem.innerText || cardElem.textContent || '').trim();



      // Sort clients by name length descending so longer names match first!

      // (e.g. 'Akanksha Nigam' matches before 'Akanksha')

      const sortedClients = [...allClients].sort((a, b) => (b.name ? b.name.length : 0) - (a.name ? a.name.length : 0));



      let foundClient = null;

      let clientName = '';



      // Scan lines of card text to find matching client

      const lines = textContent.split('\n').map(l => l.trim()).filter(Boolean);

      for (let line of lines) {

        const lineLower = line.toLowerCase();

        const match = sortedClients.find(c => {

          if (!c.name) return false;

          const cNameLower = c.name.trim().toLowerCase();

          return lineLower === cNameLower || lineLower.startsWith(cNameLower) || lineLower.includes(cNameLower);

        });

        if (match) {

          foundClient = match;

          clientName = match.name;

          break;

        }

      }



      // Extract and clean Mobile number from database object

      let phoneNum = '';

      if (foundClient) {

        const rawPhone = foundClient.phone || foundClient.whatsapp || foundClient.mobile || '';

        // Extract first 10-digit sequence from rawPhone (e.g. "94516 09405 / 8177054007" -> "9451609405")

        const digitsOnly = rawPhone.replace(/\D/g, '');

        if (digitsOnly.length >= 10) {

          if (digitsOnly.length === 12 && digitsOnly.startsWith('91')) {

            phoneNum = digitsOnly.slice(2);

          } else {

            phoneNum = digitsOnly.slice(0, 10);

          }

        }

      }



      // Title & Service

      let title = '';

      const titleElem = cardElem.querySelector('h3, h4, .task-title, div[style*="font-weight"]');

      if (titleElem) title = titleElem.innerText.trim();



      // Service Tag (e.g. ITR-4, GSTR-1)

      let serviceTag = '';

      const tagElem = cardElem.querySelector('.badge, [class*="badge"]');

      if (tagElem) serviceTag = tagElem.innerText.trim();



      // Status

      let status = '';

      const selectElem = cardElem.querySelector('select');

      if (selectElem) {

        status = selectElem.options[selectElem.selectedIndex]?.text || selectElem.value;

      } else {

        const statusBadge = cardElem.querySelector('.task-card-footer select, .task-card-footer span');

        if (statusBadge) status = statusBadge.innerText.trim();

      }



      // Dates (Due / Filing)

      let dateInfo = '';

      const dueElem = cardElem.querySelector('.due-date, [class*="due"]');

      if (dueElem) dateInfo = dueElem.innerText.trim();



      // Fee & Payment

      let feeInfo = '';

      if (textContent.includes('Fee:')) {

        const feeMatch = textContent.match(/Fee:\s*₹?\d+/i);

        if (feeMatch) feeInfo = feeMatch[0];

      }

      let payStatus = '';

      if (textContent.includes('Payment Pending')) payStatus = 'Payment Pending';

      else if (textContent.includes('Paid')) payStatus = 'Paid';



      // Task Description / Remarks / Work Instructions

      let taskDesc = '';

      const descElem = cardElem.querySelector('.task-description');

      if (descElem) {

        taskDesc = descElem.innerText.trim();

      }



      // Log note

      let logNote = '';

      if (textContent.includes('Recent Work Logs:')) {

        const parts = textContent.split('Recent Work Logs:');

        if (parts[1]) {

          logNote = parts[1].split('Add Daily Work Note')[0].trim();

        }

      }



      // Build WhatsApp formatted message

      const isPending = (status.toLowerCase().includes('pending') || textContent.toLowerCase().includes('pending'));

      const statusTag = isPending ? '⚠️ PENDING (ACTION REQUIRED)' : '✅ COMPLETED / FILED';

      const statusHeader = isPending ? '🔴 *IMPORTANT DOCUMENT / WORK UPDATE*' : '✅ *WORK COMPLETED UPDATE*';



      let msg = `${statusHeader}

`;

      msg += `━━━━━━━━━━━━━━━━━━━━━

`;

      msg += `👤 *CLIENT:* *${clientName || 'Client'}*

`;

      if (title) msg += `📌 *WORK:* *${title}*

`;

      if (dateInfo) msg += `🗓️ *DATE:* ${dateInfo}

`;

      

      msg += `

🚨 *STATUS:* *${statusTag}*

`;

      if (feeInfo) msg += `💰 *FEE:* *${feeInfo} ${payStatus ? '('+payStatus+')' : ''}*

`;

      

      if (taskDesc) {

        msg += `

⚠️ *REQUIRED DOCUMENTS / REMARKS:*

👉 *${taskDesc.trim()}*

`;

      }

      

      if (logNote) {

        msg += `

📝 *WORK LOG:*

• ${logNote.trim()}

`;

      }

      msg += `━━━━━━━━━━━━━━━━━━━━━

`;

      msg += `Kripya upar diye gaye documents/details jald se jald bhejein.



`;

      msg += `Dhanyawad! 🙏

*Leo Computers / Client Tax Services*`;



      // Fill modal with AUTO-FILLED Mobile Number from Database!

      document.getElementById('cwt-wa-mobile').value = phoneNum || '';

      document.getElementById('cwt-wa-text').value = msg;

      waModal.classList.add('cwt-open');

    };



    // --- Completed Task Card Hiding & Filter System ---

    let showingCompletedOnly = false;



    function applyCompletedCardFilter() {

      const cards = document.querySelectorAll('.task-card');

      let completedCount = 0;



      cards.forEach(card => {

        const selectElem = card.querySelector('select');

        let statusText = '';

        if (selectElem) {

          statusText = selectElem.options[selectElem.selectedIndex]?.text || selectElem.value || '';

        } else {

          statusText = card.innerText || '';

        }



        const isCompleted = statusText.toLowerCase().includes('completed') || statusText.toLowerCase().includes('filed');



        if (isCompleted) {

          completedCount++;

          if (!showingCompletedOnly) {

            card.style.display = 'none';

          } else {

            card.style.display = 'flex';

          }

        } else {

          if (showingCompletedOnly) {

            card.style.display = 'none';

          } else {

            card.style.display = 'flex';

          }

        }

      });



      // Update / Inject Completed Filter Tab

      injectCompletedTab(completedCount);

      let isItr   = notes.includes('itr');

      let isGst   = notes.includes('gst') || hasGstin;

      let isWeb   = notes.includes('web') || notes.includes('online') || notes.includes('site');

      let isBk    = notes.includes('book') || notes.includes('keep') || notes.includes('account');

      let isOther = notes.includes('other') || notes.includes('food') || notes.includes('udyam') || notes.includes('trade') || notes.includes('dsc');

      let isTrust = notes.includes('trust') || notes.includes('society') || notes.includes('ngo') || notes.includes('samiti') || notes.includes('sansthan');



      if (!isItr && !isGst && !isWeb && !isBk && !isOther && !isTrust) {

    function applyClientDirectoryFilter() {

      const rows = document.querySelectorAll('.data-table tbody tr, table tbody tr');

      const targetList = getClientListFromDOMOrArray();

      const sortedClients = [...targetList].sort((a, b) => (b.name ? b.name.length : 0) - (a.name ? a.name.length : 0));



      rows.forEach(tr => {

        const cellText = (tr.innerText || tr.textContent || '').toLowerCase();

        

        // Find exact client object by name

        const matchedClient = sortedClients.find(c => {

          if (!c.name) return false;

          const cNameLower = c.name.trim().toLowerCase();

          return cellText.includes(cNameLower);

        });



        let isItr = false, isGst = false, isWeb = false, isBk = false, isOther = false, isTrust = false;



        const types = getClientServiceTypes(matchedClient, cellText);

        isItr   = types.isItr;

        isGst   = types.isGst;

        isWeb   = types.isWeb;

        isBk    = types.isBk;

        isOther = types.isOther;

        isTrust = types.isTrust;



        if (!isItr && !isGst && !isWeb && !isBk && !isOther) isItr = true;



        // Determine client active vs inactive status

        const isClientActive = matchedClient ? matchedClient.status === 'Active' : !cellText.includes('inactive');



        // Apply visual distinction & status badge tag to table row

        const nameCell = tr.querySelector('td:nth-child(2), td strong, td:first-child');

        const oldTag = tr.querySelector('.cwt-status-tag-active, .cwt-status-tag-inactive, .cwt-inactive-tag');

        if (oldTag) oldTag.remove();



        if (!isClientActive) {

          tr.classList.add('cwt-inactive-row');

          tr.classList.remove('cwt-active-row');

          tr.style.background = 'rgba(239, 68, 68, 0.16)';

          tr.style.borderLeft = '5px solid #ef4444';

          if (nameCell) {

            const tag = document.createElement('span');

            tag.className = 'cwt-status-tag-inactive';

            tag.innerText = '🔴 DEACTIVATED';

            nameCell.appendChild(tag);

          }

        } else {

          tr.classList.remove('cwt-inactive-row');

          tr.classList.add('cwt-active-row');

          tr.style.background = '';

          tr.style.borderLeft = '5px solid #10b981';

          if (nameCell) {

            const tag = document.createElement('span');

            tag.className = 'cwt-status-tag-active';

            tag.innerText = '🟢 ACTIVE';

            nameCell.appendChild(tag);

          }

        }



        // Category filter check

        let matchesCategory = false;

        if (currentDirFilter === 'all') matchesCategory = true;

        else if (currentDirFilter === 'itr' && isItr) matchesCategory = true;

        else if (currentDirFilter === 'gst' && isGst) matchesCategory = true;

        else if (currentDirFilter === 'website' && isWeb) matchesCategory = true;

        else if (currentDirFilter === 'bookkeeping' && isBk) matchesCategory = true;

        else if (currentDirFilter === 'trust' && isTrust) matchesCategory = true;

        else if (currentDirFilter === 'other' && isOther) matchesCategory = true;



        // Status filter check

        let matchesStatus = false;

        if (currentDirStatusFilter === 'all') matchesStatus = true;

        else if (currentDirStatusFilter === 'active' && isClientActive) matchesStatus = true;

        else if (currentDirStatusFilter === 'inactive' && !isClientActive) matchesStatus = true;



        // Display row if both match

        if (matchesCategory && matchesStatus) {

          tr.style.display = '';

        } else {

          tr.style.display = 'none';

        }

      });

    }

    function setReactInputValue(inputEl, value) {

      if (!inputEl) return;

      try {

        const tracker = inputEl._valueTracker;

        if (tracker) {

          tracker.setValue(value);

        }

        const proto = inputEl.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;

        const descriptor = Object.getOwnPropertyDescriptor(proto, 'value');

        if (descriptor && descriptor.set) {

          descriptor.set.call(inputEl, value);

        } else {

          inputEl.value = value;

        }

      } catch(e) {

        inputEl.value = value;

      }

      inputEl.dispatchEvent(new Event('input', { bubbles: true }));

      inputEl.dispatchEvent(new Event('change', { bubbles: true }));

    }

    function injectThemeToggle() {

        document.body.classList.remove('cwt-light-mode');

          const isLight = document.body.classList.toggle('cwt-light-mode');

          const newTheme = isLight ? 'light' : 'dark';

      applyCompletedCardFilter();



      // Re-observe safely

      if (globalObserver) {

        globalObserver.observe(document.body, { childList: true, subtree: true });

      }

    }



    function scheduleEnhancements() {

      if (processTimer) clearTimeout(processTimer);

      processTimer = setTimeout(runDOMEnhancements, 200);

    }



    globalObserver = new MutationObserver(scheduleEnhancements);

    globalObserver.observe(document.body, { childList: true, subtree: true });



    // Global Click Listener for instant View Switching re-sync

    document.addEventListener('click', (e) => {

<script>
(function() {
  document.addEventListener('click', function(e) {
    const sendBtn = e.target.closest('button');
    if (sendBtn && (sendBtn.textContent.includes('Send on WhatsApp') || sendBtn.textContent.includes('WhatsApp'))) {
      const modal = sendBtn.closest('div');
      if (modal) {
        const phoneInp = document.querySelector('input[value*="8090933630"], input[type="text"], input[type="tel"]');
        const textInp = document.querySelector('textarea');
        
        let rawPhone = phoneInp ? phoneInp.value : '';
        let msgText = textInp ? textInp.value : '';

        let cleanPhone = rawPhone.split('/')[0].replace(/[^0-9]/g, '');
        if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

        if (cleanPhone.length >= 10) {
          e.preventDefault();
          e.stopPropagation();
          const waUrl = 'whatsapp://send?phone=' + cleanPhone + '&text=' + encodeURIComponent(msgText);
          window.location.href = waUrl;
          return;
        }
      }
    }

    const waLink = e.target.closest('a[href*="wa.me"], a[href*="whatsapp"], button[title*="WhatsApp"], .cwt-whatsapp-btn');
    if (waLink && (!sendBtn || !sendBtn.textContent.includes('Send on WhatsApp'))) {

      let cleanPhone = rawPhone.split('/')[0].replace(/[^0-9]/g, '');
      if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

      if (cleanPhone.length >= 10) {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = 'whatsapp://send?phone=' + cleanPhone;
      }
    }
  }, true);
})();

    <script>
      (function() {
        function setReactValue(element, value) {
          if (!element) return;
          try {
            const tracker = element._valueTracker;
            if (tracker) tracker.setValue(value);

            let proto = (element.tagName === 'SELECT') ? window.HTMLSelectElement.prototype : window.HTMLInputElement.prototype;
            const descriptor = Object.getOwnPropertyDescriptor(proto, 'value');
            if (descriptor && descriptor.set) {
              descriptor.set.call(element, value);
            } else {
              element.value = value;
            }
          } catch(e) {
            element.value = value;
          }
          element.dispatchEvent(new Event('input', { bubbles: true }));
          element.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function replaceServiceCategoryInTopGrid() {
          try {
            const forms = document.querySelectorAll('form, .modal-body, div[class*="modal"]');
            forms.forEach(form => {
              const text = form.innerText || form.textContent || '';
              if (!text.includes('Service Category')) return;

              // Find old Service Category select group
              const oldServiceSelect = Array.from(form.querySelectorAll('select')).find(s => {
                if (s.classList.contains('cwt-new-service-select')) return false;
                const l = s.previousElementSibling ? (s.previousElementSibling.innerText || '').toLowerCase() : '';
                return l.includes('service category') || Array.from(s.options).some(o => o.value === 'ITR' || o.value === 'GST');
              });

              if (!oldServiceSelect || !oldServiceSelect.closest('.form-group')) return;

              const oldGroup = oldServiceSelect.closest('.form-group');
              oldGroup.classList.add('cwt-old-service-group');
              oldGroup.style.setProperty('display', 'none', 'important');

              if (form.querySelector('.cwt-new-service-group')) return;

              // Create New Service Category Group in the same position
              const newGroup = document.createElement('div');
              newGroup.className = 'cwt-new-service-group form-group';
              newGroup.style.cssText = 'width: 100%; margin: 0; box-sizing: border-box;';

              newGroup.innerHTML = `
                <label style="display: block; font-size: 13px; font-weight: 700; color: #60a5fa; margin-bottom: 6px;">
                  Service Category *
                </label>
                <select class="cwt-new-service-select form-select" style="width: 100%; background: #0f172a; border: 1.5px solid #3b82f6; color: #ffffff; padding: 9px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; box-sizing: border-box; cursor: pointer;">
                  <option value="ITR">📄 ITR (Income Tax Return)</option>
                  <option value="GST">🏢 GST (GSTR-1, 3B, CMP-08)</option>
                  <option value="Food License">🍕 Food License (FSSAI)</option>
                  <option value="Udyam Registration">🏭 Udyam MSME Registration</option>
                  <option value="Online Registration of GST">🏢 New GST Registration</option>
                  <option value="Trade Mark">🏷️ Trade Mark (TM)</option>
                  <option value="DSC">🔐 Digital Signature (DSC)</option>
                  <option value="Website">🌐 Website Maintenance</option>
                  <option value="Book Keeping">📚 Book Keeping & Accounting</option>
                  <option value="Online Service">🌐 Other Online Services</option>
                </select>
              `;

              oldGroup.parentNode.insertBefore(newGroup, oldGroup);

              const newSelect = newGroup.querySelector('.cwt-new-service-select');

              newSelect.addEventListener('change', function() {
                const val = newSelect.value;

                // Sync main oldServiceSelect value for React submission
                if (val === 'ITR') setReactValue(oldServiceSelect, 'ITR');
                else if (val === 'GST') setReactValue(oldServiceSelect, 'GST');
                else if (val === 'Website') setReactValue(oldServiceSelect, 'Website');
                else setReactValue(oldServiceSelect, 'Online Service');

                // Find target fields
                const formTypeSelect = Array.from(form.querySelectorAll('select')).find(s => {
                  if (s === oldServiceSelect || s === newSelect) return false;
                  const l = s.previousElementSibling ? (s.previousElementSibling.innerText || '').toLowerCase() : '';
                  return l.includes('form type') || l.includes('return form');
                });

                const periodElement = form.querySelector('select[name*="period" i], input[name*="period" i]') || Array.from(form.querySelectorAll('select, input')).find(el => {
                  if (el === oldServiceSelect || el === newSelect || el === formTypeSelect) return false;
                  const l = el.previousElementSibling ? (el.previousElementSibling.innerText || '').toLowerCase() : '';
                  return l.includes('filing period') || l.includes('assessment year');
                });

                const titleInput = form.querySelector('input[placeholder*="title" i]') || Array.from(form.querySelectorAll('input')).find(i => {
                  const l = i.previousElementSibling ? (i.previousElementSibling.innerText || '').toLowerCase() : '';
                  return l.includes('task title');
                });

                const evcSelect = Array.from(form.querySelectorAll('select')).find(s => {
                  if (s === oldServiceSelect || s === newSelect || s === formTypeSelect || s === periodElement) return false;
                  const l = s.previousElementSibling ? (s.previousElementSibling.innerText || '').toLowerCase() : '';
                  return l.includes('verification') || l.includes('evc');
                });

                let targetForm = '', targetPeriod = '', targetTitle = '', targetEvc = 'Aadhaar OTP Verified';

                if (val === 'ITR') {
                  targetForm = 'ITR-1'; targetPeriod = 'AY 2025-26'; targetTitle = 'Income Tax Return Filing'; targetEvc = 'Aadhaar OTP Verified';
                } else if (val === 'GST') {
                  targetForm = 'GSTR-3B'; targetPeriod = 'Current Month'; targetTitle = 'GSTR-3B Tax Return Filing'; targetEvc = 'Aadhaar OTP Verified';
                } else if (val === 'Food License') {
                  targetForm = 'Food License (FSSAI)'; targetPeriod = 'FY 2026-27'; targetTitle = 'Food License (FSSAI) Application'; targetEvc = 'Aadhaar OTP Verified';
                } else if (val === 'Udyam Registration') {
                  targetForm = 'Udyam Registration'; targetPeriod = 'FY 2026-27'; targetTitle = 'Udyam MSME Registration Certificate'; targetEvc = 'Aadhaar OTP Verified';
                } else if (val === 'Online Registration of GST') {
                  targetForm = 'GST Registration'; targetPeriod = 'FY 2026-27'; targetTitle = 'New GST Registration Application'; targetEvc = 'Aadhaar OTP Verified';
                } else if (val === 'Trade Mark') {
                  targetForm = 'Trade Mark (TM)'; targetPeriod = 'FY 2026-27'; targetTitle = 'Trade Mark (TM) Filing & Application'; targetEvc = 'DSC Verified';
                } else if (val === 'DSC') {
                  targetForm = 'DSC Digital Signature'; targetPeriod = 'Current Month'; targetTitle = 'Class 3 Digital Signature (DSC) Issuance'; targetEvc = 'DSC Verified';
                } else if (val === 'Website') {
                  targetForm = 'Website Task'; targetPeriod = 'Current Month'; targetTitle = 'Website Maintenance Task'; targetEvc = 'Aadhaar OTP Verified';
                } else if (val === 'Book Keeping') {
                  targetForm = 'Other Service'; targetPeriod = 'FY 2026-27'; targetTitle = 'Book Keeping & Accounting Work'; targetEvc = 'Aadhaar OTP Verified';
                }

                if (formTypeSelect && targetForm) {
                  const opt = Array.from(formTypeSelect.options).find(o => o.value === targetForm || o.value.includes(targetForm) || o.text.includes(targetForm));
                  if (opt) setReactValue(formTypeSelect, opt.value);
                }
                if (periodElement && targetPeriod) {
                  const opt = Array.from(periodElement.options || []).find(o => o.value === targetPeriod || o.text.includes(targetPeriod));
                  if (opt) setReactValue(periodElement, opt.value);
                  else setReactValue(periodElement, targetPeriod);
                }
                if (titleInput && targetTitle) setReactValue(titleInput, targetTitle);
                if (evcSelect && targetEvc) {
                  const opt = Array.from(evcSelect.options || []).find(o => o.value === targetEvc || o.value.includes(targetEvc) || o.text.includes(targetEvc));
                  if (opt) setReactValue(evcSelect, opt.value);
                }
              });
            });
          } catch(e) {}
        }

        setInterval(replaceServiceCategoryInTopGrid, 250);
      })();
    </script>
